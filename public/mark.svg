<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="ChannelSmith">
  <!-- A smith's anvil on the same 16x16 pixel grid the wordmark's face is built on.
       Kept as unit rects so it stays crisp at 16px and scales without hinting.
       Geometry mirrors MARK_CELLS in lib/app/brand.ts. -->
  <g fill="currentColor">
    <rect x="3" y="3" width="10" height="1"/>
    <rect x="1" y="4" width="12" height="2"/>
    <rect x="3" y="6" width="10" height="1"/>
    <rect x="5" y="7" width="6" height="1"/>
    <rect x="6" y="8" width="4" height="2"/>
    <rect x="5" y="10" width="6" height="1"/>
    <rect x="2" y="11" width="11" height="2"/>
  </g>
</svg>

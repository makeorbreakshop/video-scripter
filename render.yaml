services:
  - type: web
    name: channelsmith-websub
    runtime: node
    plan: starter
    buildCommand: "echo no-build"
    startCommand: node server/websub/index.mjs
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: WEBSUB_SECRET
        sync: false
